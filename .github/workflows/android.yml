name: Build Android APK

on:
  push:
    branches: [master, main]
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('kasir-seafood/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-
          fail-on-cache-miss: false

      - name: Install npm dependencies
        working-directory: kasir-seafood
        run: npm ci

      - name: Build web assets
        working-directory: kasir-seafood
        run: npm run build
        env:
          SESSION_SECRET: github-actions-build-only-not-for-runtime

      - name: Capacitor sync android
        working-directory: kasir-seafood
        run: npx cap sync android

      - name: Build APKs
        working-directory: kasir-seafood/android
        run: ./gradlew assembleDebug assembleRelease --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: kasir-seafood/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30

      - name: Upload APK (debug)
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: kasir-seafood/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
